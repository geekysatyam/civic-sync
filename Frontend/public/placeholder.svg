<svg xmlns="http://www.w3.org/2000/svg" width="320" height="90" viewBox="0 0 320 90" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="320" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="320" height="90" rx="18" fill="url(#bgGradient)"/>

  <!-- Main Title -->
  <text
    x="160"
    y="38"
    text-anchor="middle"
    font-family="Inter, Poppins, Arial, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.8"
    fill="url(#textGradient)"
    filter="url(#softGlow)"
  >
    Civic-Sync
  </text>

  <!-- Subtitle -->
  <text
    x="160"
    y="62"
    text-anchor="middle"
    font-family="Inter, Poppins, Arial, sans-serif"
    font-size="12"
    font-weight="500"
    letter-spacing="0.6"
    fill="#E0F2FE"
    opacity="0.95"
  >
    Smart Civic Governance Platform
  </text>
</svg>